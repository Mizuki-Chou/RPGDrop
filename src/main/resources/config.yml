# ============================================================
#  RPGDrop 主配置
# ============================================================

settings:

  # 调试模式：输出每次生物死亡的匹配、概率、判定等详细信息
  debug: false

  rpgitems:
    # 是否启用 RPGItems 集成（false = 即使检测到 RPGItems 也不启用）
    enabled: true

  drops:
    # true：保留原版掉落，只额外追加自定义掉落（推荐）
    # false：清空原版掉落，只保留 RPGDrop 的掉落
    keep-vanilla-drops: true

